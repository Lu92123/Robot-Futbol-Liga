; ============================================================
;  ROBOT FUTBOL - PlatformIO + ESP-IDF + Arduino Core + Bluepad32
;
;  Platform : pioarduino/platform-espressif32 (55.03.31-2 -> ESP-IDF 5.5)
;  Framework: espidf  (el core de Arduino entra como componente IDF
;             desde components/arduino)
;  Board   : ESP32 Dev Module (ESP32-WROOM-32)
;
;  El codigo del robot vive en src/main.cpp (+ src/main.c con app_main)
; ============================================================

[platformio]
src_dir = src
default_envs = esp32dev

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31-2/platform-espressif32.zip
framework = espidf
monitor_speed = 115200
monitor_filters = direct
upload_speed = 460800
board_build.embed_txtfiles =
    managed_components/espressif__esp_insights/server_certs/https_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt

[env:esp32dev]
board = esp32dev
; Particion propia (app0 1.8125 MB + spiffs + coredump).
; PlatformIO genera el partition table desde este CSV (ver espidf.py:1925).
board_build.partitions = partitions.csv
upload_port = COM3
monitor_port = COM3
